# NRFS configuration
CONFIG_NRFS=y
CONFIG_NRFS_LOCAL_DOMAIN=y
CONFIG_NRFS_BACKEND_IPC_SERVICE=y
# With logging enabled memory usage is higher
CONFIG_NRFS_BACKEND_TX_TASK_STACK_SIZE=2048

# IPC configuration
CONFIG_IPC_SERVICE=y
CONFIG_IPC_SERVICE_BACKEND_ICMSG=y
CONFIG_MBOX=y
CONFIG_MBOX_NRFX_IDS=y

# Misc
CONFIG_NRF_REGTOOL_VERBOSE_ON=y
