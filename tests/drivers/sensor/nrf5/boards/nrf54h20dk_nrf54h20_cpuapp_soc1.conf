CONFIG_MBOX_NRFX_IDS=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_PRINTK=y

# NRFS configuration
CONFIG_NRFS=y
CONFIG_NRFS_LOCAL_DOMAIN=y
CONFIG_NRFS_BACKEND_IPC_SERVICE=y
CONFIG_NRFS_BACKEND_RX_TASK_STACK_SIZE=2048
CONFIG_NRFS_BACKEND_TX_TASK_STACK_SIZE=2048
