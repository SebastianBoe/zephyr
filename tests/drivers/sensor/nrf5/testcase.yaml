tests:
  drivers.sensor.nrf5.fpga:
    platform_allow: nrf54h20dk_nrf54h20_cpuapp@soc1, nrf54l15dk_nrf54l15_cpuapp@soc1
    tags: drivers
    extra_configs:
      - CONFIG_EMULATOR_FPGA=y
  drivers.sensor.nrf5.emu_z1:
    platform_allow: nrf54h20dk_nrf54h20_cpuapp@soc1, nrf54l15dk_nrf54l15_cpuapp@soc1
    tags: drivers
    extra_args: OVERLAY_CONFIGS="serial_emulator_z1.overlay"
    extra_configs:
      - CONFIG_EMULATOR_Z1=y
