tests:
  drivers.counter.basic_api:
    tags: drivers counter
    depends_on: counter
    min_ram: 16
    platform_exclude: nucleo_f302r8
    timeout: 600
  drivers.counter.basic_api.nrf_zli:
    tags: drivers counter
    depends_on: counter
    platform_allow: nrf52840dk_nrf52840 nrf54h20dk_nrf54h20_cpusys@soc1 nrf54h20dk_nrf54h20_cpusec@soc1 nrf54h20dk_nrf54h20_cpuapp@soc1 nrf54h20dk_nrf54h20_cpurad@soc1 nrf54h20dk_nrf54h20_cpuppr@soc1 nrf54l15dk_nrf54l15_cpuapp@soc1
    timeout: 400
    extra_configs:
      - CONFIG_ZERO_LATENCY_IRQS=y
    extra_args:
      DTC_OVERLAY_FILE="boards/nrf52840dk_nrf52840.overlay;boards/nrf52840dk_nrf52840_zli.overlay"
