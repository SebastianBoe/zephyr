# Debug optimization
CONFIG_ASSERT=y
CONFIG_DEBUG=y
CONFIG_DEBUG_OPTIMIZATIONS=y

CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y

# Memory usage config
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_ISR_STACK_SIZE=1024
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_IDLE_STACK_SIZE=512
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# NRFS configuration
CONFIG_NRFS_LOCAL_DOMAIN=y
CONFIG_NRFS_BACKEND_IPC_SERVICE=y
CONFIG_NRFS_BACKEND_RX_TASK_STACK_SIZE=2048
CONFIG_NRFS_BACKEND_TX_TASK_STACK_SIZE=2048

# Misc
CONFIG_NRF_REGTOOL_VERBOSE_ON=y

# Stack options
CONFIG_THREAD_STACK_INFO=y
CONFIG_STACK_SENTINEL=y

# Do not build additional images
CONFIG_INCLUDE_SECDOM=n
CONFIG_INCLUDE_SYSCTRL=n

CONFIG_MBOX_NRFX_IDS=y
#CONFIG_NRF_REGTOOL_GENERATE_TOML_CONFIG=y
#
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_USB_DRIVER_LOG_LEVEL_INF=y

CONFIG_USB_DEVICE_PRODUCT="nRF54H20 CDC ACM"
CONFIG_USB_DW_USB_2_0=y
CONFIG_USB_DC_HAS_HS_SUPPORT=y

CONFIG_HWINFO=n
