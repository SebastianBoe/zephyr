sample:
  description: This app provides an example of how to integrate OpenAMP
      with Zephyr.
  name: OpenAMP example integration
tests:
  sample.ipc.openamp:
    platform_allow: lpcxpresso54114_m4 lpcxpresso55s69_cpu0 mps2_an521 v2m_musca v2m_musca_b1
                    nrf54h20dk_nrf54h20_cpurad@soc1 nrf54h20dk_nrf54h20_cpuapp@soc1
    integration_platforms:
      - mps2_an521
    tags: ipm
    harness: console
    sysbuild: true
    harness_config:
      type: multi_line
      regex:
        - "Master core received a message: 1"
        - "Master core received a message: 99"
        - "OpenAMP demo ended."
