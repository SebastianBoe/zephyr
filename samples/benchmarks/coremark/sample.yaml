sample:
    name: CoreMark Benchmark
    description: CoreMark sample for the CPU performance evaluation.
                 Sample runs the CoreMark benchmark that measures the CPU efficiency
                 performing  different algorithms like state machine, crc calculation,
                 matrix manipulation and list processing (find and sort).
tests:
  sample.benchmark.coremark:
    build_only: true
    platform_allow: nrf52dk_nrf52832 nrf52840dk_nrf52840
    integration_platforms:
      - nrf52840dk_nrf52840
    tags: ci_build
  sample.benchmark.coremark.lowpower:
    build_only: true
    platform_allow: nrf54h20dk_nrf54h20_cpuapp_soc1
    integration_platforms:
      - nrf54h20dk_nrf54h20_cpuapp_soc1
    tags: ci_build
    extra_args:
      OVERLAY_CONFIG=boards/nrf54h20dk_nrf54h20_cpuapp_soc1_low_power.conf
